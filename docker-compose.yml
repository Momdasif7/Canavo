services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canavo
      POSTGRES_PASSWORD: canavo
      POSTGRES_DB: canavo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canavo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
